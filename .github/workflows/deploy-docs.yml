name: Deploy Site

# Publishes a single GitHub Pages site:
#   /            -> the marketing landing + demos (site/index.html, gallery, sandbox, examples)
#   /docs/       -> the VitePress documentation
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "packages/js/**"
      - "packages/gpu/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel in-progress production deploys.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lastUpdated needs full git history
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/js/package-lock.json
      - uses: actions/configure-pages@v5

      - name: Install deps
        working-directory: packages/js
        run: npm ci

      - name: Build the VitePress docs
        working-directory: packages/js
        run: npm run docs:build

      # The WebGL2 particle demos (packages/gpu/example) import the gpu bundle; build it
      # so the assemble step can ship a self-contained copy alongside the demos.
      - name: Build the helix-noise-gpu bundle
        # No committed lockfile for this package (see .gitignore), so npm install, not ci.
        working-directory: packages/gpu
        run: npm install && npm run build

      - name: Assemble the Pages site (landing at /, docs at /docs)
        run: |
          set -e
          SITE="$RUNNER_TEMP/_site"
          SRC=packages/js
          rm -rf "$SITE" && mkdir -p "$SITE"
          # Project landing (site/) -> site root
          cp site/index.html "$SITE/"
          # Demos + the assets/dist they reference (they belong with the JS package) -> site root
          cp "$SRC/gallery.html" "$SRC/sandbox.html" "$SITE/"
          cp -R "$SRC/examples" "$SRC/assets" "$SRC/dist" "$SITE/"
          # WebGL2 particle demos (packages/gpu/example) -> /examples/gpu/, with the gpu
          # bundle and core laid out so each demo's importmap ("../dist/index.js",
          # "../node_modules/helix-noise/dist/helix-noise.js") resolves unchanged.
          mkdir -p "$SITE/examples/gpu" "$SITE/examples/dist" "$SITE/examples/node_modules/helix-noise/dist"
          cp packages/gpu/example/*.html "$SITE/examples/gpu/"
          cp packages/gpu/dist/index.js "$SITE/examples/dist/index.js"
          cp "$SRC/dist/helix-noise.js" "$SITE/examples/node_modules/helix-noise/dist/helix-noise.js"
          # VitePress output (built with base /helix-noise/docs/) -> /docs
          mkdir -p "$SITE/docs"
          cp -R "$SRC/docs/.vitepress/dist/." "$SITE/docs/"
          echo "Assembled site:"; find "$SITE" -maxdepth 1 | sort

      # The bundle filenames carry no content hash and Pages serves them with `max-age=600`, so a
      # visitor who loaded the site in the ten minutes before a deploy gets the fresh HTML against
      # the stale cached bundle. That is exactly how examples/two-scale.html — a page that did not
      # exist in the previous deploy, so it could not be cached — came to call `HelixNoise.abc`
      # against a 1.1.0 build that never exported it: `abc is not a function`, self-healing after
      # the TTL, which is the worst kind of bug to be handed. Stamping the commit onto every
      # reference makes the cache miss certain. The sources keep their plain relative paths.
      - name: Cache-bust the bundle references
        run: |
          set -e
          SITE="$RUNNER_TEMP/_site"
          V="${GITHUB_SHA::7}"
          # VitePress already content-hashes its own assets, and none of these patterns occur there.
          find "$SITE" -name '*.html' -not -path "$SITE/docs/*" -print0 | xargs -0 sed -i \
            -e "s|helix-noise\.global\.js\"|helix-noise.global.js?v=$V\"|g" \
            -e "s|node_modules/helix-noise/dist/helix-noise\.js\"|node_modules/helix-noise/dist/helix-noise.js?v=$V\"|g" \
            -e "s|\.\./dist/index\.js\"|../dist/index.js?v=$V\"|g"
          # A sed that silently matches nothing is the failure mode this step exists to prevent,
          # so make the count load-bearing rather than decorative.
          N="$(grep -rlF "?v=$V" "$SITE" --include='*.html' | wc -l | tr -d ' ')"
          echo "Stamped ?v=$V into $N pages."
          if [ "$N" -eq 0 ]; then
            echo "::error::cache-bust matched nothing — the bundle reference paths must have changed"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
